name: CI

on:
  push:
    branches: [main, "bluetype/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history and files
        run: |
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" zricethezav/gitleaks:v8.30.1 git /src --log-opts=--all --config /src/.gitleaks.toml --redact=100 --no-banner
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" zricethezav/gitleaks:v8.30.1 dir /src --config /src/.gitleaks.toml --redact=100 --no-banner

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run scripts/run_unit_tests.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bunx tsc --noEmit --incremental false
        working-directory: web
      - run: bun run build
        working-directory: web
